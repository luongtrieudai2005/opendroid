name: android-pentest-full
version: 2.0
author: "trieudai"
description: >
  Complete Android penetration testing workflow from APK acquisition
  through static/dynamic analysis to final report. Covers 9 phases:
  Phase 0 (program intelligence, tier classification, scope matrix),
  recon, static analysis, IPC testing, dynamic + network analysis,
  local storage, backend API, advanced testing, and reporting.

# ------------------------------------------------------------------
# Global variables
# ------------------------------------------------------------------
vars:
  jadx_timeout: 300
  nuclei_severity: "critical,high"
  frida_script: "scripts/universal-unpin.js"
  proxy_port: 8080
  wordlist_xss: "config/wordlists/xss.txt"
  wordlist_sqli: "config/wordlists/sqli.txt"
  wordlist_dirs: "config/wordlists/dirs.txt"

# ------------------------------------------------------------------
# Tool aliases — swap implementations without changing steps
# ------------------------------------------------------------------
tools:
  decompiler: jadx              # or: apktool
  ssl_bypass: frida             # or: objection
  root_bypass: frida            # or: objection
  runtime_hook: frida           # or: xposed

# ------------------------------------------------------------------
# Phases
# ------------------------------------------------------------------
phases:

  # ================================================================
  # PHASE 0: Program & Scope Intelligence
  # ================================================================
  - name: program-intelligence
    description: "Analyze program policy, classify target tier (A/B), build scope matrix"
    on_fail: continue

    steps:
      - id: program_intel
        tool: program_intelligence
        description: "Analyze program policy, build scope matrix, classify tier"
        params:
          program_name: "{target.app_name}"
          package_name: "{target.package}"
          policy_text: ""
          signal_count: 0
        on_fail: continue

      - id: tier_check
        tool: tier_classifier
        description: "Cross-check tier classification with manual input"
        params:
          max_bounty: 0
          out_of_scope_count: 0
          submission_estimate: 0
          has_hall_of_fame: false
          policy_detail: "low"
        on_fail: continue

      - id: github_dork
        tool: github_dorker
        description: "Quick GitHub secret scan (package name dork)"
        params:
          query: "{target.package}"
          max_results: 20
        on_fail: continue

  # ================================================================
  # PHASE 1: Reconnaissance & Preparation
  # ================================================================
  - name: recon-preparation
    description: "Target scoping, APK acquisition, environment setup"
    on_fail: stop

    steps:
      - id: apk_import
        tool: apk_importer
        description: "Import APK into workspace, compute hash, register target"
        params:
          apk_path: "{target.apk}"
          package_name: "{target.package}"

      - id: env_check
        tool: env_checker
        description: "Verify all required tools are available"
        params:
          required:
            - adb
            - jadx
            - frida
            - subfinder
            - httpx
            - nuclei
            - curl

      - id: tech_intel
        tool: tech_intel
        description: "Tech blog & job posting intelligence (service names, naming patterns)"
        params:
          company_name: "{target.app_name}"
        on_fail: continue

  # ================================================================
  # PHASE 2: Static Analysis (Deep)
  # ================================================================
  - name: static-analysis
    description: "Decompile APK, analyze manifest, source, secrets, native libs"
    on_fail: stop

    steps:
      - id: decompile
        tool: "{tools.decompiler}"
        description: "Decompile APK with jadx"
        params:
          apk: "{apk_import.apk_path}"
          output: "workspace/jadx/{target.package}"
        on_fail: stop

      - id: manifest
        tool: manifest_parser
        description: "Extract and analyze AndroidManifest.xml"
        params:
          input: "{decompile.output}"
          extract_components: true
          extract_permissions: true
        depends_on: [decompile]

      - id: endpoints
        tool: endpoint_extractor
        description: "Extract all URLs, API endpoints from decompiled source"
        params:
          input: "{decompile.output}"
          min_confidence: low
        depends_on: [decompile]

      - id: secrets
        tool: secret_hunter
        description: "Hunt for hardcoded secrets: API keys, tokens, passwords, JWT, Firebase, AWS"
        params:
          input: "{decompile.output}"
          patterns:
            - type: api_key
              regex: '(?i)(api[_-]?key|apikey)\s*[:=]\s*[''"]([^''"]{8,})[''"]'
              confidence: high
            - type: firebase_url
              regex: 'https://[a-z0-9-]+\.firebaseio\.com'
              confidence: high
            - type: firebase_url_v2
              regex: 'https://[a-z0-9-]+\.firebaseapp\.com'
              confidence: high
            - type: aws_key
              regex: 'AKIA[0-9A-Z]{16}'
              confidence: high
            - type: aws_secret
              regex: '(?i)(aws_secret|secret_access_key)\s*[:=]\s*[''"]([^''"]+)[''"]'
              confidence: high
            - type: jwt
              regex: 'eyJ[a-zA-Z0-9_-]+\.eyJ[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+'
              confidence: medium
            - type: password
              regex: '(?i)(password|passwd|pwd)\s*[:=]\s*[''"]([^''"]{4,})[''"]'
              confidence: medium
            - type: generic_token
              regex: '(?i)(token|secret|private_key|client_secret)\s*[:=]\s*[''"]([^''"]{8,})[''"]'
              confidence: low
        depends_on: [decompile]

      - id: mobsf_scan
        tool: mobsf_analyze
        description: "Full MobSF static analysis (OWASP MASVS, malware tracking, CVE deps)"
        params:
          apk_path: "{apk_import.apk_path}"
          target_id: "{target.id}"
        depends_on: [apk_import]
        on_fail: continue

      - id: obfuscation
        tool: obfuscation_detector
        description: "Detect ProGuard/R8 obfuscation, string encryption, reflection"
        params:
          input: "{decompile.output}"
        depends_on: [decompile]

      - id: third_party
        tool: third_party_analyzer
        description: "Identify third-party SDKs and their versions"
        params:
          input: "{decompile.output}"
        depends_on: [decompile]

      - id: native_libs
        tool: native_analyzer
        description: "Analyze native .so libraries for exported functions and strings"
        params:
          input: "{decompile.output}"
        depends_on: [decompile]

      - id: firebase_check
        tool: cloud_checker
        description: "Check discovered Firebase URLs for public access"
        params:
          endpoints: "{endpoints.result}"
          secrets: "{secrets.result}"
          verify: true
        depends_on: [endpoints, secrets]
        on_fail: continue

      - id: manifest_findings
        tool: finding_aggregator
        description: "Generate structural findings from manifest analysis"
        params:
          manifest: "{manifest.result}"
          obfuscation: "{obfuscation.result}"
        depends_on: [manifest, obfuscation]

      - id: content_provider_scan
        tool: content_provider_scanner
        description: "Scan Content Providers for path traversal + SQL injection"
        params:
          input: "{decompile.output}"
          package: "{target.package}"
        depends_on: [decompile]
        on_fail: continue

      - id: flutter_detect
        tool: flutter_detect_apk
        description: "Detect if APK is Flutter, extract engine version"
        params:
          apk_path: "{apk_import.apk_path}"
        depends_on: [apk_import]
        on_fail: continue

      - id: flutter_blutter
        tool: flutter_blutter_analyze
        description: "Blutter analysis of libapp.so via WSL2 (for Flutter apps only)"
        params:
          lib_dir: "{apk_import.apk_path}/lib/arm64-v8a"
          output_dir: "workspace/blutter"
        depends_on: [apk_import, flutter_detect]
        on_fail: continue
        when: "{flutter_detect.is_flutter} == True"

      - id: flutter_pp_parse
        tool: flutter_blutter_parse_pp
        description: "Parse Blutter pp.txt → extract URLs, secrets, classes"
        params:
          pp_path: "{flutter_blutter.pp_path}"
        depends_on: [flutter_blutter]
        on_fail: continue
        when: "{flutter_blutter.pp_path | length > 0}"

  # ================================================================
  # PHASE 3: IPC & Component Testing
  # ================================================================
  - name: ipc-component-testing
    description: "Test exported components, deep links, intents, task hijacking"
    on_fail: continue

    steps:
      - id: exported_components
        tool: component_analyzer
        description: "List all exported activities, services, receivers, providers"
        params:
          manifest: "{manifest.result}"
        depends_on: [manifest]

      - id: deep_links
        tool: deep_link_analyzer
        description: "Extract and test deep link URLs for hijacking"
        params:
          input: "{decompile.output}"
        depends_on: [decompile]

      - id: intent_analyzer
        tool: intent_analyzer
        description: "Analyze intent filters and intent redirection patterns"
        params:
          input: "{decompile.output}"
          components: "{exported_components.result}"
        depends_on: [decompile, exported_components]

      - id: intent_redirection
        tool: intent_redirection_finder
        description: "Find intent forwarding without getCallingPackage validation"
        params:
          input: "{decompile.output}"
        depends_on: [decompile, intent_analyzer]
        on_fail: continue

      - id: deep_link_fuzz
        tool: deep_link_fuzzer
        description: "Fuzz deep link URIs for token leak / auth bypass"
        params:
          input: "{decompile.output}"
          package: "{target.package}"
          test_on_device: false
        depends_on: [decompile, deep_links]
        on_fail: continue

      - id: component_fuzz
        tool: component_fuzzer
        description: "Fuzz exported components via ADB (malformed intents, crash test)"
        params:
          package: "{target.package}"
          input: "{decompile.output}"
          test_malformed: true
        depends_on: [decompile, exported_components]
        on_fail: continue

  # ================================================================
  # PHASE 4: Dynamic Analysis + Network Traffic
  # ================================================================
  - name: dynamic-network-analysis
    description: "Runtime instrumentation, SSL bypass, traffic capture & analysis"
    on_fail: continue

    steps:
      - id: ssl_bypass
        tool: "{tools.ssl_bypass}"
        description: "Bypass SSL certificate pinning"
        params:
          package: "{target.package}"
          script: "{vars.frida_script}"
        on_fail: continue

      - id: root_bypass
        tool: "{tools.root_bypass}"
        description: "Bypass root detection if present"
        params:
          package: "{target.package}"
        on_fail: continue

      - id: proxy_setup
        tool: android_proxy
        description: "Set Android emulator/device proxy to Burp"
        params:
          action: "set"
          port: "{vars.proxy_port}"
        on_fail: continue

      - id: traffic_capture
        tool: traffic_capturer
        description: "Capture HTTP/HTTPS traffic through Burp/mitmproxy"
        params:
          target_id: "{target.id}"
          duration: 120
          source: burp
        depends_on: [ssl_bypass, proxy_setup]
        on_fail: continue

      - id: api_discovery
        tool: api_discovery
        description: "Extract API endpoints from captured traffic"
        params:
          requests: "{traffic_capture.result}"
        depends_on: [traffic_capture]

      - id: websocket_check
        tool: websocket_checker
        description: "Check for WebSocket connections in traffic"
        params:
          requests: "{traffic_capture.result}"
        depends_on: [traffic_capture]

      - id: frida_bypass_all
        tool: frida_bypass_all
        description: "Combined Frida bypass: SSL unpin + root bypass + proxy force"
        params:
          package: "{target.package}"
          proxy_host: "127.0.0.1"
          proxy_port: "{vars.proxy_port}"
          mode: spawn
        depends_on: [ssl_bypass]
        on_fail: continue

      - id: frida_auto_hooks
        tool: frida_auto_hook
        description: "Auto-generate Frida hooks from decompiled classes (crypto, net, storage)"
        params:
          input: "{decompile.output}"
          target_package: "{target.package}"
          max_hooks: 15
        depends_on: [decompile]
        on_fail: continue

      - id: flutter_tls_bypass
        tool: flutter_tls_bypass_frida
        description: "Bypass Flutter BoringSSL TLS via NVISO Frida script"
        params:
          package: "{target.package}"
          mode: spawn
          timeout: 120
        depends_on: [flutter_detect, ssl_bypass]
        on_fail: continue
        when: "{flutter_detect.is_flutter} == True"

  # ================================================================
  # PHASE 5: Local Storage & Data Analysis
  # ================================================================
  - name: local-storage-analysis
    description: "Examine SharedPreferences, SQLite, files, keystore"
    on_fail: continue

    steps:
      - id: shared_prefs
        tool: shared_prefs_analyzer
        description: "Extract and analyze SharedPreferences XML"
        params:
          package: "{target.package}"
        on_fail: continue

      - id: sqlite_dbs
        tool: sqlite_analyzer
        description: "Extract and analyze local SQLite databases"
        params:
          package: "{target.package}"
        on_fail: continue

      - id: file_system
        tool: file_system_analyzer
        description: "List app files and caches for sensitive data"
        params:
          package: "{target.package}"
        on_fail: continue

      - id: keystore
        tool: keystore_analyzer
        description: "Check Android Keystore usage and implementation"
        params:
          input: "{decompile.output}"
          package: "{target.package}"
        depends_on: [decompile]
        on_fail: continue

      - id: sandbox_dump
        tool: sandbox_full_dump
        description: "Dynamic sandbox: dump DBs, prefs, logs, filesystem, screenshot"
        params:
          package: "{target.package}"
          output_dir: "workspace/sandbox"
          log_duration: 20
        on_fail: continue

  # ================================================================
  # PHASE 6: Backend API Testing
  # ================================================================
  - name: backend-api-testing
    description: "Test API endpoints from static analysis + traffic"
    when: "{endpoints.result | length > 0}"

    steps:
      - id: target_domains
        tool: domain_extractor
        description: "Extract unique domains from all endpoints"
        params:
          endpoints: "{endpoints.result}"
          traffic: "{api_discovery.result}"

      - id: crtsh
        tool: crtsh_enum
        description: "CT log subdomain enum for first discovered domain"
        params:
          domain: "{target_domains.result | first}"
        depends_on: [target_domains]
        when: "{target_domains.result | length > 0}"
        on_fail: continue

      - id: subdomains
        tool: subfinder
        description: "Passive subdomain enumeration (all discovered domains)"
        params:
          domains: "{target_domains.result}"
        depends_on: [target_domains]
        on_fail: continue

      - id: httpx
        tool: httpx
        description: "HTTP probing and tech detection"
        params:
          targets: "{subdomains.result}"
        depends_on: [subdomains]

      - id: nuclei
        tool: nuclei
        description: "Vulnerability scanning with nuclei"
        params:
          targets: "{httpx.result | map(.url)}"
          severity: "{vars.nuclei_severity}"
        depends_on: [httpx]

      - id: api_fuzz
        tool: api_fuzzer
        description: "Fuzz API endpoints for common vulnerabilities (xss + sqli)"
        params:
          endpoints: "{endpoints.result}"
          payloads:
            xss: "{vars.wordlist_xss}"
            sqli: "{vars.wordlist_sqli}"
        depends_on: [endpoints]

      - id: auth_test
        tool: auth_tester
        description: "Test authentication and authorization"
        params:
          endpoints: "{endpoints.result}"
          traffic: "{traffic_capture.result}"
        depends_on: [endpoints, traffic_capture]

      - id: graphql_scan
        tool: graphql_scanner
        description: "Scan for GraphQL endpoints, introspection, auth bypass"
        params:
          endpoints: "{endpoints.result}"
          token: ""
        depends_on: [endpoints]
        on_fail: continue

      - id: idor_test
        tool: idor_scanner
        description: "Test IDOR/BOLA with token swap on parameterised endpoints"
        params:
          endpoints: "{endpoints.result}"
          traffic: "{traffic_capture.result}"
          token_a: ""
          token_b: ""
        depends_on: [endpoints, traffic_capture]
        on_fail: continue

      - id: param_tamper
        tool: param_tamper_scanner
        description: "Test critical params: price, role, admin, discount"
        params:
          endpoints: "{endpoints.result}"
          traffic: "{traffic_capture.result}"
          token: ""
        depends_on: [endpoints, traffic_capture]
        on_fail: continue

      - id: jwt_scan
        tool: jwt_analyzer
        description: "Analyze JWT tokens for alg=none, weak secret, sensitive data"
        params:
          jwt_tokens: []
          traffic: "{traffic_capture.result}"
        depends_on: [traffic_capture]
        on_fail: continue

  # ================================================================
  # PHASE 7: Advanced Testing
  # ================================================================
  - name: advanced-testing
    description: "WebView, JS interfaces, hybrid app, cryptography"
    on_fail: continue

    steps:
      - id: webview
        tool: webview_analyzer
        description: "Analyze WebView configurations and JS interfaces"
        params:
          input: "{decompile.output}"
        depends_on: [decompile]

      - id: js_interface
        tool: js_interface_tester
        description: "Test JavaScript bridge for RCE and data leakage"
        params:
          input: "{decompile.output}"
          webviews: "{webview.result}"
        depends_on: [decompile, webview]

      - id: cryptography
        tool: crypto_analyzer
        description: "Analyze cryptographic implementations for weaknesses"
        params:
          input: "{decompile.output}"
        depends_on: [decompile]

      - id: backup_test
        tool: backup_tester
        description: "Test ADB backup and auto-backup configurations"
        params:
          package: "{target.package}"
          allow_backup: "{manifest.allow_backup}"
        depends_on: [manifest]
        on_fail: continue

  # ================================================================
  # PHASE 8: Reporting
  # ================================================================
  - name: reporting
    description: "Generate comprehensive pentest report"
    on_fail: continue

    steps:
      - id: generate_report
        tool: report_generator
        description: "Generate markdown report with all findings"
        params:
          target_id: "{target.id}"
          format: markdown
          output: "{workspace}/report.md"
